<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>GeoQuiz</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0b0e14;--surface:#151a23;--surface2:#1e2530;--border:rgba(255,255,255,.05);
  --text:#fff;--text2:#8b95a5;--accent:#4f8cff;--accent-glow:rgba(79,140,255,.3);
  --green:#2ecc71;--red:#ff4d4d;--yellow:#f1c40f;
  --radius:18px;--radius-sm:12px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font);user-select:none;-webkit-user-select:none;display:flex;flex-direction:column}
::-webkit-scrollbar{display:none}
#app{flex:1;overflow-y:auto;padding:16px 16px 100px;scroll-behavior:smooth}
.screen{display:none}
.screen.active{display:block;animation:fade .3s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.h1{font-size:28px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px}
.sub{font-size:14px;color:var(--text2);margin-bottom:22px}
.sec{font-size:17px;font-weight:700;margin:22px 0 12px;display:flex;align-items:center;gap:8px}
.card{background:var(--surface);border-radius:var(--radius);padding:20px;margin-bottom:12px;border:1px solid var(--border);transition:transform .2s var(--ease),background .2s;cursor:pointer;position:relative;overflow:hidden}
.card:active{transform:scale(.98);background:var(--surface2)}
.card-grad{background:linear-gradient(135deg,#1a2a4a 0%,#0f172a 100%);border:1px solid rgba(79,140,255,.2);box-shadow:0 8px 32px rgba(0,0,0,.4)}
.card-grad::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at top right,var(--accent-glow),transparent 70%);pointer-events:none}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{background:var(--surface);border-radius:var(--radius);padding:16px 14px;border:1px solid var(--border);transition:transform .2s var(--ease),background .2s;cursor:pointer;display:flex;flex-direction:column;gap:10px}
.cat:active{transform:scale(.96);background:var(--surface2)}
.cat-ico{width:42px;height:42px;border-radius:10px;background:rgba(79,140,255,.12);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.cat-ico svg{width:22px;height:22px;fill:currentColor}
.cat h3{font-size:14px;font-weight:700}
.cat p{font-size:11px;color:var(--text2)}
.item{display:flex;align-items:center;background:var(--surface);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:8px;border:1px solid var(--border);cursor:pointer;transition:transform .2s var(--ease),background .2s}
.item:active{transform:scale(.98);background:var(--surface2)}
.item-num{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:var(--accent);margin-right:14px;flex-shrink:0}
.item-info h3{font-size:14px;font-weight:600;margin-bottom:2px}
.item-info p{font-size:11px;color:var(--text2)}
.prof-head{display:flex;flex-direction:column;align-items:center;margin:16px 0 28px}
.prof-ava{width:92px;height:92px;border-radius:50%;border:4px solid var(--surface2);object-fit:cover;margin-bottom:12px;box-shadow:0 0 24px var(--accent-glow);background:var(--surface2)}
.prof-name{font-size:21px;font-weight:800}
.prof-user{font-size:13px;color:var(--accent);margin-top:4px;font-weight:500}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.stat{background:var(--surface);padding:14px;border-radius:var(--radius-sm);text-align:center;border:1px solid var(--border)}
.stat .v{font-size:22px;font-weight:800;color:var(--accent)}
.stat .l{font-size:10px;color:var(--text2);margin-top:4px;text-transform:uppercase;letter-spacing:.4px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.badge{background:var(--surface);border:1px solid var(--border);padding:8px 12px;border-radius:10px;font-size:11px;font-weight:700;color:var(--text2);display:flex;align-items:center;gap:6px}
.badge.earned{background:rgba(79,140,255,.12);border-color:rgba(79,140,255,.3);color:var(--accent)}
.badge svg{width:14px;height:14px;fill:currentColor}
.game-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.prog{flex:1;height:7px;background:var(--surface2);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),#6a9cff);width:0%;transition:width .3s var(--ease);border-radius:4px}
.timer{width:34px;height:34px;position:relative;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--yellow)}
.timer svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke:var(--surface2);stroke-width:3}
.timer .t-fill{stroke:var(--yellow);stroke-dasharray:100;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear}
.q-text{font-size:19px;font-weight:700;line-height:1.4;margin-bottom:20px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--surface);border:2px solid transparent;color:var(--text);padding:15px;border-radius:var(--radius-sm);font-size:15px;font-weight:600;text-align:left;cursor:pointer;transition:all .2s var(--ease);display:flex;align-items:center;gap:12px}
.opt:active{transform:scale(.98)}
.opt.correct{background:rgba(46,204,113,.15);border-color:var(--green)}
.opt.wrong{background:rgba(255,77,77,.15);border-color:var(--red)}
.opt.done{pointer-events:none;opacity:.6}
.opt-l{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--text2);flex-shrink:0}
.opt.correct .opt-l{background:var(--green);color:#fff}
.opt.wrong .opt-l{background:var(--red);color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.tf-btn{padding:18px;border-radius:var(--radius-sm);border:2px solid transparent;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s var(--ease);display:flex;flex-direction:column;align-items:center;gap:6px}
.tf-btn.true{background:rgba(46,204,113,.1);color:var(--green);border-color:rgba(46,204,113,.2)}
.tf-btn.false{background:rgba(255,77,77,.1);color:var(--red);border-color:rgba(255,77,77,.2)}
.tf-btn:active{transform:scale(.96)}
.tf-btn.correct{background:var(--green);color:#fff}
.tf-btn.wrong{background:var(--red);color:#fff}
.tf-btn.done{pointer-events:none;opacity:.6}
.rank{display:flex;flex-direction:column;gap:8px}
.rank-i{background:var(--surface);padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;transition:transform .2s var(--ease)}
.rank-c{display:flex;gap:6px}
.rank-b{background:rgba(255,255,255,.08);border:none;color:var(--text);width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:background .2s}
.rank-b:active{background:var(--accent)}
.res{text-align:center;padding:30px 0}
.res-circ{width:130px;height:130px;margin:0 auto 18px;position:relative}
.res-circ svg{width:100%;height:100%;transform:rotate(-90deg)}
.res-circ circle{fill:none;stroke-width:9}
.res-circ .bg{stroke:var(--surface2)}
.res-circ .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s ease}
.res-score{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:30px;font-weight:900}
.res-text{font-size:16px;color:var(--text2);margin-bottom:24px}
.btn{display:block;width:100%;padding:15px;border-radius:var(--radius-sm);border:none;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s var(--ease);text-align:center}
.btn:active{transform:scale(.98);opacity:.9}
.btn-primary{background:var(--accent);color:#fff}
.btn-outline{background:transparent;border:2px solid var(--surface2);color:var(--text)}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(11,14,20,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--border);z-index:100}
.nav-i{display:flex;flex-direction:column;align-items:center;color:var(--text2);font-size:10px;font-weight:600;cursor:pointer;transition:color .2s;width:64px;padding:4px 0;gap:2px}
.nav-i svg{width:21px;height:21px;fill:currentColor}
.nav-i.active{color:var(--accent)}
.hidden{display:none!important}
.mt-10{margin-top:10px}
.mt-16{margin-top:16px}
.exit-btn{background:rgba(255,255,255,.06);border:none;color:var(--text2);width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.exit-btn:active{background:var(--red);color:#fff}
</style>
</head>
<body>
<div id="app">
<div id="screen-home" class="screen active">
<div class="h1">GeoQuiz</div>
<div class="sub">Проверь свою эрудицию</div>
<div class="card card-grad" onclick="quickStart()">
<div style="position:relative;z-index:1">
<h2 style="font-size:21px;margin-bottom:6px;font-weight:800">Быстрый вызов</h2>
<p style="font-size:13px;color:rgba(255,255,255,.7);margin-bottom:14px">10 случайных вопросов из всех категорий</p>
<div style="display:inline-block;background:rgba(255,255,255,.15);padding:8px 16px;border-radius:10px;font-size:13px;font-weight:700">Играть →</div>
</div>
</div>
<div class="sec">Категории</div>
<div class="grid-2" id="home-cats"></div>
<div class="sec">Режимы</div>
<div id="home-modes"></div>
</div>
<div id="screen-tests" class="screen">
<div class="h1">Все тесты</div>
<div class="sub">Выбирай тему и уровень</div>
<div id="all-tests"></div>
</div>
<div id="screen-profile" class="screen">
<div class="prof-head">
<img id="tg-ava" class="prof-ava" src="https://telegram.org/img/t_logo.png" alt="avatar">
<div id="tg-name" class="prof-name">Гость</div>
<div id="tg-user" class="prof-user">@unknown</div>
</div>
<div class="stats">
<div class="stat"><div class="v" id="st-games">0</div><div class="l">Игр</div></div>
<div class="stat"><div class="v" id="st-correct">0</div><div class="l">Верных</div></div>
<div class="stat"><div class="v" id="st-acc">0%</div><div class="l">Точность</div></div>
<div class="stat"><div class="v" id="st-streak">0</div><div class="l">Серия</div></div>
</div>
<div class="sec">Достижения</div>
<div class="badges" id="badges"></div>
<button class="btn btn-outline mt-16" onclick="resetStats()">Сбросить статистику</button>
<div style="text-align:center;margin-top:16px;color:var(--text2);font-size:12px">Данные хранятся локально</div>
</div>
<div id="screen-game" class="screen">
<div class="game-head">
<button class="exit-btn" onclick="exitGame()">✕</button>
<div class="prog"><div class="prog-fill" id="prog"></div></div>
<div class="timer" id="timer-box">
<svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.9"/><circle class="t-fill" id="timer-fill" cx="18" cy="18" r="15.9" stroke-dasharray="100" stroke-dashoffset="0"/></svg>
<span id="timer-text"></span>
</div>
</div>
<div id="game-content"></div>
</div>
<div id="screen-result" class="screen">
<div class="res">
<div class="res-circ">
<svg viewBox="0 0 120 120">
<circle class="bg" cx="60" cy="60" r="52"/>
<circle class="fg" id="res-circle" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7"/>
</svg>
<div class="res-score" id="res-score">0/10</div>
</div>
<div class="res-text" id="res-text">Неплохо!</div>
<button class="btn btn-primary" onclick="goHome()">На главную</button>
<button class="btn btn-outline mt-10" onclick="replayLast()">Пройти ещё раз</button>
</div>
</div>
</div>
<div class="nav">
<div class="nav-i active" data-tab="home" onclick="switchTab('home',this)">
<svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
Главная
</div>
<div class="nav-i" data-tab="tests" onclick="switchTab('tests',this)">
<svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
Тесты
</div>
<div class="nav-i" data-tab="profile" onclick="switchTab('profile',this)">
<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
Профиль
</div>
</div>
<script>
const tg=window.Telegram?.WebApp;
if(tg){
  tg.ready();
  tg.expand();
  const u=tg.initDataUnsafe?.user;
  if(u){
    document.getElementById('tg-name').textContent=(u.first_name||'')+(u.last_name?' '+u.last_name:'');
    document.getElementById('tg-user').textContent=u.username?'@'+u.username:'@id'+u.id;
    if(u.photo_url)document.getElementById('tg-ava').src=u.photo_url;
  }
}

const STATS_KEY='gq_stats_v3';
const ACH_KEY='gq_ach_v3';
let stats={games:0,correct:0,total:0,streak:0,bestStreak:0,bestByCat:{}};
let achievements={};

function loadStats(){
  try{const r=localStorage.getItem(STATS_KEY);if(r)Object.assign(stats,JSON.parse(r));}catch(e){}
  try{const a=localStorage.getItem(ACH_KEY);if(a)achievements=JSON.parse(a);}catch(e){}
  renderStats();
  renderBadges();
}
function saveStats(){localStorage.setItem(STATS_KEY,JSON.stringify(stats))}
function saveAch(){localStorage.setItem(ACH_KEY,JSON.stringify(achievements))}

function renderStats(){
  document.getElementById('st-games').textContent=stats.games;
  document.getElementById('st-correct').textContent=stats.correct;
  document.getElementById('st-acc').textContent=stats.total?Math.round(stats.correct/stats.total*100)+'%':'0%';
  document.getElementById('st-streak').textContent=stats.bestStreak;
}

const ACHIEVEMENTS=[
  {id:'first',name:'Первая игра',icon:'<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>',check:s=>s.games>=1},
  {id:'ten',name:'10 игр',icon:'<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>',check:s=>s.games>=10},
  {id:'fifty',name:'50 игр',icon:'<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>',check:s=>s.games>=50},
  {id:'hundred_correct',name:'100 верных',icon:'<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>',check:s=>s.correct>=100},
  {id:'streak5',name:'5 подряд',icon:'<svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9z"/></svg>',check:s=>s.bestStreak>=5},
  {id:'streak10',name:'10 подряд',icon:'<svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9z"/></svg>',check:s=>s.bestStreak>=10},
  {id:'streak25',name:'25 подряд',icon:'<svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9z"/></svg>',check:s=>s.bestStreak>=25},
  {id:'accuracy80',name:'80% точность',icon:'<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>',check:s=>s.total>=20&&s.correct/s.total>=.8},
  {id:'all_cats',name:'Все категории',icon:'<svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>',check:s=>Object.keys(s.bestByCat||{}).length>=4}
];

function renderBadges(){
  const el=document.getElementById('badges');
  el.innerHTML=ACHIEVEMENTS.map(a=>{
    const earned=achievements[a.id]||a.check(stats);
    return `<div class="badge ${earned?'earned':''}">${a.icon}${a.name}</div>`;
  }).join('');
}

function checkAchievements(){
  let changed=false;
  ACHIEVEMENTS.forEach(a=>{
    if(!achievements[a.id]&&a.check(stats)){
      achievements[a.id]=true;
      changed=true;
    }
  });
  if(changed){saveAch();renderBadges();}
}

function resetStats(){
  if(!confirm('Сбросить всю статистику?'))return;
  stats={games:0,correct:0,total:0,streak:0,bestStreak:0,bestByCat:{}};
  achievements={};
  saveStats();saveAch();renderStats();renderBadges();
}

const CATEGORIES=[
  {id:'geo',name:'География',desc:'Страны, столицы, реки, горы',icon:'<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>'},
  {id:'politics',name:'Политика',desc:'Правление, лидеры, союзы',icon:'<svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>'},
  {id:'history',name:'История',desc:'Даты, события, империи',icon:'<svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>'},
  {id:'economy',name:'Экономика',desc:'Валюты, ВВП, ресурсы',icon:'<svg viewBox="0 0 24 24"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>'}
];

const MODES=[
  {id:'classic',name:'Классика',desc:'10 вопросов, 4 варианта'},

{q:'Расставьте валюты по стоимости (от дорогой к дешевой)',items:['Фунт','Евро','Доллар','Рубль'],correct:['Фунт','Евро','Доллар','Рубль']},
{q:'Расставьте страны по ВВП (от большего к меньшему)',items:['США','Китай','Япония','Германия'],correct:['США','Китай','Япония','Германия']}
]
};

function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function pick(arr,n){return shuffle(arr).slice(0,n)}

function generateChoice(cat){
  if(cat==='geo'){
    const r=Math.random();
    if(r<.4){
      const c=pick(DB.capitals,1)[0];
      const wrong=pick(DB.capitals.filter(x=>x.c!==c.c),3).map(x=>x.c);
      const opts=shuffle([c.c,...wrong]);
      const variants=['Столица страны: '+c.n,'Какой город является столицей '+c.n+'?','Где находится столица '+c.n+'?'];
      return{type:'choice',q:variants[Math.floor(Math.random()*variants.length)],opts,correct:opts.indexOf(c.c)};
    }else if(r<.7){
      const c=pick(DB.capitals,1)[0];
      const wrong=pick(DB.capitals.filter(x=>x.n!==c.n),3).map(x=>x.n);
      const opts=shuffle([c.n,...wrong]);
      return{type:'choice',q:'В какой стране находится город '+c.c+'?',opts,correct:opts.indexOf(c.n)};
    }else{
      const f=pick(DB.facts,1)[0];
      const opts=shuffle(f.opts);
      return{type:'choice',q:f.q,opts,correct:opts.indexOf(f.a)};
    }
  }
  if(cat==='history'){
    const d=pick(DB.dates,1)[0];
    const opts=shuffle(d.opts);
    return{type:'choice',q:d.q,opts,correct:opts.indexOf(d.a)};
  }
  if(cat==='politics'){
    const p=pick(DB.politics,1)[0];
    const opts=shuffle(p.opts);
    return{type:'choice',q:p.q,opts,correct:opts.indexOf(p.a)};
  }
  if(cat==='economy'){
    const e=pick(DB.economy,1)[0];
    const opts=shuffle(e.opts);
    return{type:'choice',q:e.q,opts,correct:opts.indexOf(e.a)};
  }
  return generateChoice('geo');
}

function generateTF(cat){
  const pool=TRUE_FALSE_POOL[cat]||TRUE_FALSE_POOL.geo;
  const item=pick(pool,1)[0];
  const flip=Math.random()>.5;
  let statement=item.t;
  let correct=item.v;
  if(flip){
    correct=!item.v;
    statement=item.t
      .replace(' — ',' — не ')
      .replace(' является ',' не является ')
      .replace(' входит ',' не входит ')
      .replace(' самая ',' не самая ')
      .replace(' самый ',' не самый ')
      .replace(' самое ',' не самое ')
      .replace(' крупнейший ',' не крупнейший ');
    if(statement===item.t)statement='Неверно ли утверждение: '+item.t;
  }
  return{type:'tf',q:statement,correct};
}

function generateRank(cat){
  const pool=RANK_POOL[cat]||RANK_POOL.geo;
  const r=pick(pool,1)[0];
  return{type:'rank',q:r.q,items:shuffle(r.items),correct:r.correct};
}

function generateQuestion(cat,mode){
  if(mode==='tf')return generateTF(cat);
  if(mode==='rank')return generateRank(cat);
  if(mode==='mixed'){
    const r=Math.random();
    if(r<.5)return generateChoice(cat);
    if(r<.75)return generateTF(cat);
    return generateRank(cat);
  }
  return generateChoice(cat);
}

function buildQuiz(cat,mode,count=10){
  const qs=[];
  const usedKeys=new Set();
  let attempts=0;
  while(qs.length<count&&attempts<count*5){
    attempts++;
    const q=generateQuestion(cat,mode);
    const key=q.q;
    if(usedKeys.has(key))continue;
    usedKeys.add(key);
    qs.push(q);
  }
  return qs;
}

let currentQuiz=null;
let currentQuestionIndex=0;
let currentScore=0;
let currentStreak=0;
let timerInterval=null;
let timeLeft=10;
let currentMode='classic';
let currentCategory='geo';
let lastGame=null;

function startGame(cat,mode){
  lastGame={cat,mode};
  currentCategory=cat;
  currentMode=mode;
  currentQuiz=buildQuiz(cat,mode,10);
  currentQuestionIndex=0;
  currentScore=0;
  currentStreak=0;
  showScreen('game');
  renderQuestion();
}

function replayLast(){
  if(lastGame)startGame(lastGame.cat,lastGame.mode);
  else goHome();
}

function exitGame(){
  if(!confirm('Выйти из игры? Прогресс не сохранится.'))return;
  clearInterval(timerInterval);
  currentQuiz=null;
  goHome();
}

function renderQuestion(){
  clearInterval(timerInterval);
  if(!currentQuiz||currentQuestionIndex>=currentQuiz.length){
    finishGame();
    return;
  }
  const q=currentQuiz[currentQuestionIndex];
  document.getElementById('prog').style.width=((currentQuestionIndex/currentQuiz.length)*100)+'%';
  const content=document.getElementById('game-content');
  let html='<div class="q-text">'+q.q+'</div>';
  if(q.type==='choice'){
    html+='<div class="opts">';
    q.opts.forEach((o,i)=>{
      html+='<div class="opt" data-i="'+i+'" onclick="answerChoice('+i+')"><div class="opt-l">'+String.fromCharCode(65+i)+'</div>'+o+'</div>';
    });
    html+='</div>';
  }else if(q.type==='tf'){
    html+='<div class="tf">';
    html+='<div class="tf-btn true" data-v="true" onclick="answerTF(true)">Верно</div>';
    html+='<div class="tf-btn false" data-v="false" onclick="answerTF(false)">Неверно</div>';
    html+='</div>';
  }else if(q.type==='rank'){
    html+='<div class="rank" id="rank-list">';
    q.items.forEach((item,i)=>{
      html+='<div class="rank-i" data-i="'+i+'"><span>'+item+'</span><div class="rank-c"><button class="rank-b" onclick="moveRank(this,-1)">↑</button><button class="rank-b" onclick="moveRank(this,1)">↓</button></div></div>';
    });
    html+='</div>';
    html+='<button class="btn btn-primary mt-16" onclick="answerRank()">Проверить</button>';
  }
  content.innerHTML=html;
  if(currentMode==='blitz'){
    timeLeft=10;
    document.getElementById('timer-text').textContent=timeLeft;
    document.getElementById('timer-fill').style.strokeDashoffset=0;
    timerInterval=setInterval(()=>{
      timeLeft--;
      document.getElementById('timer-text').textContent=timeLeft>0?timeLeft:'';
      document.getElementById('timer-fill').style.strokeDashoffset=((10-timeLeft)/10)*100;
      if(timeLeft<=0){
        clearInterval(timerInterval);
        handleTimeout();
      }
    },1000);
  }else{
    document.getElementById('timer-text').textContent='';
    document.getElementById('timer-fill').style.strokeDashoffset=0;
  }
}

function answerChoice(i){
  const q=currentQuiz[currentQuestionIndex];
  if(!q||q.answered)return;
  q.answered=true;
  clearInterval(timerInterval);
  const opts=document.querySelectorAll('.opt');
  opts.forEach((o,idx)=>{
    o.classList.add('done');
    if(idx===q.correct)o.classList.add('correct');
    else if(idx===i)o.classList.add('wrong');
  });
  handleAnswer(i===q.correct);
}

function answerTF(val){
  const q=currentQuiz[currentQuestionIndex];
  if(!q||q.answered)return;
  q.answered=true;
  clearInterval(timerInterval);
  const btns=document.querySelectorAll('.tf-btn');
  btns.forEach(b=>{
    b.classList.add('done');
    const isTrue=b.dataset.v==='true';
    if(isTrue===q.correct)b.classList.add('correct');
    else if(isTrue===val)b.classList.add('wrong');
  });
  handleAnswer(val===q.correct);
}

function moveRank(btn,dir){
  const item=btn.closest('.rank-i');
  const parent=item.parentNode;
  const items=Array.from(parent.children);
  const idx=items.indexOf(item);
  const newIdx=idx+dir;
  if(newIdx<0||newIdx>=items.length)return;
  if(dir<0)parent.insertBefore(item,items[newIdx]);
  else parent.insertBefore(items[newIdx],item);
}

function answerRank(){
  const q=currentQuiz[currentQuestionIndex];
  if(!q||q.answered)return;
  q.answered=true;
  clearInterval(timerInterval);
  const items=document.querySelectorAll('.rank-i');
  const userOrder=Array.from(items).map(el=>el.querySelector('span').textContent);
  const isCorrect=JSON.stringify(userOrder)===JSON.stringify(q.correct);
  items.forEach((el,i)=>{
    el.style.opacity='.7';
    if(el.querySelector('span').textContent===q.correct[i])el.style.borderColor='var(--green)';
    else el.style.borderColor='var(--red)';
  });
  handleAnswer(isCorrect);
}

function handleTimeout(){
  const q=currentQuiz[currentQuestionIndex];
  if(!q||q.answered)return;
  q.answered=true;
  handleAnswer(false);
}

function handleAnswer(isCorrect){
  if(isCorrect){
    currentScore++;
    currentStreak++;
  }else{
    currentStreak=0;
  }
  stats.total++;
  if(isCorrect)stats.correct++;
  stats.streak=currentStreak;
  if(currentStreak>stats.bestStreak)stats.bestStreak=currentStreak;
  saveStats();
  setTimeout(()=>{
    currentQuestionIndex++;
    renderQuestion();
  },650);
}

function finishGame(){
  clearInterval(timerInterval);
  stats.games++;
  if(!stats.bestByCat)stats.bestByCat={};
  if(!stats.bestByCat[currentCategory]||currentScore>stats.bestByCat[currentCategory]){
    stats.bestByCat[currentCategory]=currentScore;
  }
  saveStats();
  checkAchievements();
  renderStats();
  const total=currentQuiz?currentQuiz.length:10;
  const pct=total?Math.round(currentScore/total*100):0;
  const circle=document.getElementById('res-circle');
  const offset=326.7-(326.7*pct/100);
  setTimeout(()=>{circle.style.strokeDashoffset=offset;},50);
  document.getElementById('res-score').textContent=currentScore+'/'+total;
  let txt='';
  if(pct===100)txt='Идеально! Ты знаток.';
  else if(pct>=80)txt='Отличный результат!';
  else if(pct>=60)txt='Неплохо, но есть куда расти.';
  else if(pct>=40)txt='Можно лучше.';
  else txt='Попробуй еще раз.';
  document.getElementById('res-text').textContent=txt;
  showScreen('result');
}

function switchTab(tab,el){
  document.querySelectorAll('.nav-i').forEach(n=>n.classList.remove('active'));
  if(el)el.classList.add('active');
  showScreen(tab);
  if(tab==='tests')renderAllTests();
  if(tab==='profile'){renderStats();renderBadges();}
}

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el=document.getElementById('screen-'+name);
  if(el)el.classList.add('active');
}

function goHome(){
  clearInterval(timerInterval);
  currentQuiz=null;
  showScreen('home');
  document.querySelectorAll('.nav-i').forEach(n=>n.classList.remove('active'));
  const homeNav=document.querySelector('.nav-i[data-tab="home"]');
  if(homeNav)homeNav.classList.add('active');
}

function quickStart(){
  const cats=['geo','politics','history','economy'];
  const cat=cats[Math.floor(Math.random()*cats.length)];
  const modes=['classic','mixed','blitz'];
  const mode=modes[Math.floor(Math.random()*modes.length)];
  startGame(cat,mode);
}

function renderHome(){
  const catsEl=document.getElementById('home-cats');
  catsEl.innerHTML=CATEGORIES.map(c=>`
    <div class="cat" onclick="startGame('${c.id}','classic')">
      <div class="cat-ico">${c.icon}</div>
      <h3>${c.name}</h3>
      <p>${c.desc}</p>
    </div>`).join('');
  const modesEl=document.getElementById('home-modes');
  modesEl.innerHTML=MODES.map(m=>`
    <div class="item" onclick="startGame('geo','${m.id}')">
      <div class="item-num">${m.name[0]}</div>
      <div class="item-info"><h3>${m.name}</h3><p>${m.desc}</p></div>
    </div>`).join('');
}

function renderAllTests(){
  const el=document.getElementById('all-tests');
  let html='';
  CATEGORIES.forEach(c=>{
    html+=`<div class="sec">${c.name}</div>`;
    MODES.forEach((m,i)=>{
      html+=`<div class="item" onclick="startGame('${c.id}','${m.id}')">
        <div class="item-num">${i+1}</div>
        <div class="item-info"><h3>${m.name}</h3><p>${m.desc}</p></div>
      </div>`;
    });
  });
  el.innerHTML=html;
}

document.addEventListener('DOMContentLoaded',()=>{
  loadStats();
  renderHome();
  renderAllTests();
});
</script>
